name: Weekly Feishu Report

# 每周日 00:00 日本时间（JST, UTC+9）自动运行 → 抓取上周美股/港股数据，
# 渲染海报 + 生成社交文案，推送到飞书。
#
# 时区换算: 周日 00:00 JST = 周六 15:00 UTC → cron "0 15 * * 6"
# (cron 使用 UTC；day-of-week 6 = 周六)
on:
  schedule:
    - cron: "0 15 * * 6"
  workflow_dispatch:        # 也支持在 GitHub Actions 页面手动触发
    inputs:
      start:
        description: "开始日期 YYYYMMDD（留空 = 上一交易周）"
        required: false
        default: ""
      end:
        description: "结束日期 YYYYMMDD（留空 = 上一交易周）"
        required: false
        default: ""

# 避免同一时段并发重复运行
concurrency:
  group: weekly-feishu
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write           # keepalive 步骤需要推送权限
    env:
      TZ: Asia/Tokyo          # 让 Python datetime.now() 对齐日本时间
    defaults:
      run:
        working-directory: koreanbuywhat
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
          fetch-depth: 0          # keepalive 需要读最后一次 commit 时间

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Generate posters + social copy and push to Feishu
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
        # 手动触发时若填了 start/end 就跑指定周（用于补映射后重跑），
        # 否则（定时触发 / 留空）跑上一交易周。
        run: |
          if [ -n "$START" ] && [ -n "$END" ]; then
            echo "重跑指定周: $START ~ $END"
            python notify_feishu.py "$START" "$END"
          else
            python notify_feishu.py
          fi

      # ── Keepalive ────────────────────────────────────────────────────
      # GitHub 会在仓库「60 天无提交」后自动停用定时任务，
      # 而 workflow 跑成功本身不算活动 —— 只有 commit 才算。
      # 这里在距上次提交 ≥45 天时自动产生一次极小的提交，重置计时器。
      - name: Keepalive (prevent 60-day schedule auto-disable)
        if: github.event_name == 'schedule'
        working-directory: .
        run: |
          LAST=$(git log -1 --format=%ct)
          DAYS=$(( ( $(date +%s) - LAST ) / 86400 ))
          echo "距上次提交 ${DAYS} 天"
          if [ "$DAYS" -lt 45 ]; then
            echo "未到 45 天阈值，跳过 keepalive"
            exit 0
          fi
          mkdir -p .github
          date -u +"last scheduled run: %Y-%m-%dT%H:%M:%SZ" > .github/last-run.txt
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/last-run.txt
          git commit -m "chore: keepalive — reset 60-day schedule timer"
          git push
