name: Weekly Feishu Report

# 每周日 00:00 日本时间（JST, UTC+9）自动运行 → 抓取上周美股/港股数据，
# 渲染海报 + 生成社交文案，推送到飞书。
#
# 时区换算: 周日 00:00 JST = 周六 15:00 UTC → cron "0 15 * * 6"
# (cron 使用 UTC；day-of-week 6 = 周六)
on:
  schedule:
    - cron: "0 15 * * 6"
  workflow_dispatch:        # 也支持在 GitHub Actions 页面手动触发
    inputs:
      start:
        description: "开始日期 YYYYMMDD（留空 = 上一交易周）"
        required: false
        default: ""
      end:
        description: "结束日期 YYYYMMDD（留空 = 上一交易周）"
        required: false
        default: ""

# 避免同一时段并发重复运行
concurrency:
  group: weekly-feishu
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Tokyo          # 让 Python datetime.now() 对齐日本时间
    defaults:
      run:
        working-directory: koreanbuywhat
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Generate posters + social copy and push to Feishu
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
        # 手动触发时若填了 start/end 就跑指定周（用于补映射后重跑），
        # 否则（定时触发 / 留空）跑上一交易周。
        run: |
          if [ -n "$START" ] && [ -n "$END" ]; then
            echo "重跑指定周: $START ~ $END"
            python notify_feishu.py "$START" "$END"
          else
            python notify_feishu.py
          fi
